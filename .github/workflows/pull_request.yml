name: ci

on:
  pull_request:
    paths-ignore:
      - 'deploy/helm/**'
      - 'docs/**'
      - 'MAINTAINERS'
      - '*.md'
      - 'LICENSE'
    branches:
      # on pull requests to develop and release branches
      - develop
      - 'v*'

env:
  GO_VERSION: 1.19.13
  GO_VERSION_PN: 1.23.4
  PROVISIONER_NFS_IMAGE: provisioner-nfs
  NFS_SERVER_IMAGE: nfs-server-alpine
  EXPORT_PATH: /tmp
  IMAGE_ORG: ${{ github.repository_owner }}
  IMAGE_ARCH: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: License Check
        run: make license-check

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit test
        run: make test

      - name: Verify corrections
        run: make verify-src

      # - name: Upload Coverage Report
      #   uses: codecov/codecov-action@v5

  sanity-build:
    # to ignore builds on release
    if: ${{ (github.event.ref_type != 'tag') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [provisioner-nfs, nfs-server-alpine]
        go_version: [v1.23.4, v1.19.13]
        make_step: [provisioner-nfs-image, nfs-server-image]
    needs: ['lint', 'unit-test']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go_version }}

      - name: Build image
        run: make ${{ matrix.make_step }}

      - name: Export images
        run: make output-image

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}
          path: ${{ env.EXPORT_PATH }}/${{ matrix.image }}.tar

  sanity-test:
    # to ignore builds on release
    if: ${{ (github.event.ref_type != 'tag') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        kubernetes: [v1.27.3, v1.29.12, v1.30.8, v1.31.0]
    needs: ['lint', 'unit-test', 'sanity-build']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download provisioner-nfs image
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROVISIONER_NFS_IMAGE }}
          path: ${{ env.EXPORT_PATH }}

      - name: Download nfs-server-alpine image
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.NFS_SERVER_IMAGE }}
          path: ${{ env.EXPORT_PATH }}

      - name: Load images
        run: make load-image

      - name: Install NFS utils
        run: |
          sudo apt-get update && sudo apt-get install -y nfs-common

      - name: Setup Minikube-Kubernetes
        uses: medyagh/setup-minikube@latest
        with:
          cache: false
          minikube-version: 1.34.0
          driver: none
          kubernetes-version: ${{ matrix.kubernetes }}
          cni: calico
          start-args: '--install-addons=false'

      - name: Installation
        run: |
          ./tests/install-localpv.sh
          ./tests/install-nfs-provisioner.sh

      - name: Running sanity tests
        run: make sanity-test

  provisioner-nfs:
    runs-on: ubuntu-latest
    needs: ['lint', 'unit-test']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./buildscripts/provisioner-nfs/provisioner-nfs.Dockerfile
          push: false
          platforms: ${{ env.IMAGE_ARCH }}
          tags: |
            ${{ env.IMAGE_ORG }}/provisioner-nfs:ci

  nfs-server:
    runs-on: ubuntu-latest
    needs: ['lint', 'unit-test']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.5.1

      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          context: ./nfs-server-container
          file: nfs-server-container/Dockerfile
          push: false
          platforms: ${{ env.IMAGE_ARCH }}
          tags: |
            ${{ env.IMAGE_ORG }}/nfs-server-alpine:ci

  nfs-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the nfs-e2e image
        uses: docker/build-push-action@v6
        with:
          file: ./e2e-tests/Dockerfile
          push: false
          load: false
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_ORG }}/nfs-e2e:ci
